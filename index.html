<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나만의 헬스 플랜</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>나만의 헬스 플랜</h1>
    <p class="lead">정보를 입력하면 목표 체중에 맞는 식단 가이드와 운동 프로그램을 추천합니다.</p>

    <form id="profile-form" novalidate>
      <div class="field" data-field="age">
        <label for="age">나이</label>
        <input id="age" name="age" type="number" inputmode="numeric" min="18" max="80" step="1" required>
        <p class="error" role="alert"></p>
      </div>

      <fieldset class="field" data-field="sex">
        <legend>성별</legend>
        <label><input type="radio" name="sex" value="male"> 남성</label>
        <label><input type="radio" name="sex" value="female"> 여성</label>
        <p class="error" role="alert"></p>
      </fieldset>

      <div class="field" data-field="heightCm">
        <label for="heightCm">키 (cm)</label>
        <input id="heightCm" name="heightCm" type="number" inputmode="decimal" min="120" max="230" step="0.1" required>
        <p class="error" role="alert"></p>
      </div>

      <div class="field" data-field="weightKg">
        <label for="weightKg">현재 체중 (kg)</label>
        <input id="weightKg" name="weightKg" type="number" inputmode="decimal" min="30" max="300" step="0.1" required>
        <p class="error" role="alert"></p>
      </div>

      <div class="field" data-field="targetWeightKg">
        <label for="targetWeightKg">목표 체중 (kg)</label>
        <input id="targetWeightKg" name="targetWeightKg" type="number" inputmode="decimal" min="30" max="300" step="0.1" required>
        <p class="error" role="alert"></p>
      </div>

      <div class="field" data-field="level">
        <label for="level">운동 경험 수준</label>
        <select id="level" name="level" required>
          <option value="">선택하세요</option>
          <option value="beginner">초급 (운동 6개월 미만)</option>
          <option value="intermediate">중급 (6개월~2년)</option>
          <option value="advanced">고급 (2년 이상)</option>
        </select>
        <p class="error" role="alert"></p>
      </div>

      <button type="submit">플랜 만들기</button>
    </form>

    <section id="result" hidden aria-live="polite"></section>

    <p class="disclaimer">이 결과는 일반적인 참고 정보이며 의학적 조언이 아닙니다. 질환이 있거나 통증이 있다면 운동 전에 전문가와 상담하세요.</p>
  </main>

  <script src="src/validate.js"></script>
  <script src="src/metrics.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
